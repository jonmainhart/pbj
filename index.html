<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>PBJ Dashboard</title>
  
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#526f69">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">

  <link
    rel="stylesheet"
    href="./assets/style.css"
  >

  <script
    type="module"
    src="./assets/app.js"
  ></script>
</head>

<body>
<div
  class="announcement announcement-top"
  id="announcement-top"
  hidden
></div>

  <header class="site-header">
    <div class="header-content">
      <div>
        <p class="eyebrow">2026 NFL Season</p>
        <h1>PBJ Football</h1>
        <p class="subtitle">
          Football, beer, and bragging rights.
        </p>
      </div>

      <div class="week-status">
        <div
          id="week-status"
          aria-live="polite"
        >
          Loading…
        </div>
      </div>
    </div>
  </header>

  <main class="page-shell">
    <nav
      class="view-tabs"
      aria-label="Dashboard views"
    >
      <button
        class="tab-button active"
        id="weekly-tab"
        type="button"
        aria-selected="true"
      >
        🏈 Weekly
      </button>

      <button
        class="tab-button"
        id="season-tab"
        type="button"
        aria-selected="false"
      >
        🏆 Season
      </button>
    </nav>

    <section
      id="weekly-view"
      class="dashboard-view"
    >
      <div class="view-heading">
        <div>
          <p class="section-label">
            Weekly results
          </p>

          <h2 id="week-heading">
            Week 1
          </h2>
        </div>

        <label class="week-picker">
          <span>Week</span>

          <select id="week-select"></select>
        </label>
      </div>

      <div
        id="weekly-summary"
        class="summary-grid"
      ></div>

      <div
        id="weekly-message"
        class="message"
        aria-live="polite"
      ></div>

      <section>
        <div class="weekly-view-toggle" role="group" aria-label="Weekly presentation">
          <button id="players-toggle" type="button" aria-pressed="true">Players</button>
          <button id="games-toggle" type="button" aria-pressed="false">Games</button>
        </div>
        <h3 class="section-heading" id="weekly-list-heading">
          Players
        </h3>

        <div
          id="player-list"
          class="player-list"
        ></div>
        <div id="game-list" class="player-list" role="region" aria-label="Games" hidden></div>
      </section>
    </section>

    <section
      id="season-view"
      class="dashboard-view"
      hidden
    >
      <div class="view-heading">
        <div>
          <p class="section-label">
            Season standings
          </p>

          <h2>2026 Leaderboard</h2>
        </div>
      </div>

      <div
        id="season-message"
        class="message"
        aria-live="polite"
      ></div>

      <div
        id="season-list"
        class="season-list"
      ></div>
    </section>
  </main>

<div
  class="announcement announcement-bottom"
  id="announcement-bottom"
  hidden
></div>

  <footer class="site-footer">
    <p>
      &copy; 2026 Plus-Sized Squirrels
      <span aria-hidden="true">•</span>
      Code licensed under <a href="/LICENSE">Apache 2.0</a>
      <span aria-hidden="true">•</span>
      <a href="/LICENSE-SCOPE.md">Data &amp; artwork terms</a>
      <span aria-hidden="true">•</span>
      <button type="button" class="footer-link" data-document="rules">Rules</button>
    </p>
  </footer>
</body>
</html>
