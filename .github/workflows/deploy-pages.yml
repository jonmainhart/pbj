name: Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - data/**.json
      - RULES.md
      - LICENSE
      - LICENSE-SCOPE.md
      - CNAME
      - manifest.webmanifest
      - scripts/build_site.py
      - scripts/generate_documents.py
      - pyproject.toml
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:
  # Bot commits do not trigger push workflows. Publish after data processing.
  workflow_run:
    workflows: [Create Weekly Schedule, Import Weekly Picks, Update Game Results]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.changes.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Always build the current production branch, including bot commits.
          ref: main
      - name: Check for processing changes
        id: changes
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          PROCESSING_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$TRIGGER_EVENT" = workflow_run ] && [ "$(git rev-parse HEAD)" = "$PROCESSING_SHA" ]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v7
        if: steps.changes.outputs.publish == 'true'
        with:
          python-version: '3.14'
      - name: Install document generation dependencies
        if: steps.changes.outputs.publish == 'true'
        run: python -m pip install '.[docs]'
      - name: Build public site
        if: steps.changes.outputs.publish == 'true'
        run: python -m scripts.build_site
      - uses: actions/upload-pages-artifact@v4
        if: steps.changes.outputs.publish == 'true'
        with:
          path: build/site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy public site
        id: deployment
        uses: actions/deploy-pages@v4
