name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Select checks
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          base = os.environ['BASE']
          full = os.environ['EVENT'] == 'workflow_dispatch' or not base or set(base) == {'0'}
          if not full:
              # Fail closed: a missing base or failed diff fails the QA job.
              subprocess.run(['git', 'cat-file', '-e', base], check=True)
              if os.environ['EVENT'] == 'pull_request':
                  base = subprocess.check_output(
                      ['git', 'merge-base', base, os.environ['HEAD']], text=True
                  ).strip()
              paths = subprocess.check_output(
                  ['git', 'diff', '--name-only', '--no-renames', '-z', base, os.environ['HEAD']]
              ).decode().split('\0')
          else:
              paths = []
          python = frontend = build = full
          for path in filter(None, paths):
              if path.startswith('.github/') or path in {
                  'pyproject.toml', 'package.json', 'package-lock.json',
                  'eslint.config.js', 'playwright.config.js', '.gitignore',
              }:
                  python = frontend = build = True
              elif path.endswith('.py'):
                  python = build = True
                  if path.startswith('scripts/'):
                      frontend = True
              elif path.endswith(('.js', '.html', '.css')):
                  frontend = build = True
              elif path.endswith('.md') or path in {'LICENSE', 'CNAME', 'manifest.webmanifest'}:
                  build = True
              elif path.startswith('data/') and path.endswith(('.json', '.csv')):
                  pass
              elif path.startswith('assets/'):
                  frontend = build = True
              else:
                  # Unknown configuration/source types must not bypass validation.
                  python = frontend = build = True
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              for key, value in [('python', python), ('frontend', frontend), ('build', build)]:
                  output.write(f'{key}={str(value).lower()}\n')
          print(f'Python={python}, frontend={frontend}, build={build}')
          PY
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          def reject_constant(value):
              raise ValueError(f'Nonstandard JSON constant: {value}')

          for name in subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0'):
              if name.endswith(('.json', '.webmanifest')):
                  try:
                      with Path(name).open() as source:
                          json.load(source, parse_constant=reject_constant)
                  except (ValueError, OSError) as error:
                      raise SystemExit(f'{name}: {error}') from error
          PY
      - name: Install Python development dependencies
        if: steps.changes.outputs.python == 'true' || steps.changes.outputs.frontend == 'true' || steps.changes.outputs.build == 'true'
        run: python -m pip install '.[dev,aws]'
      - name: Python quality
        if: steps.changes.outputs.python == 'true'
        run: |
          ruff check .
          ruff format --check .
          mypy src scripts tests
          pytest
      - uses: actions/setup-node@v6
        if: steps.changes.outputs.frontend == 'true'
        with:
          node-version: '22'
          cache: npm
      - name: Frontend quality
        if: steps.changes.outputs.frontend == 'true'
        run: |
          npm ci
          npm run lint
          npm run test:unit
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Document and build validation
        if: steps.changes.outputs.build == 'true'
        run: |
          python -m scripts.generate_documents
          pytest -q tests/test_generate_documents.py tests/test_build_site.py tests/test_legal_notice.py
          python -m scripts.build_site
