name: Deploy AWS shadow

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-aws-shadow
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/test/aws-upgrade'
    runs-on: ubuntu-latest
    environment: aws-staging
    timeout-minutes: 20
    env:
      AWS_REGION: us-east-2
      FUNCTION_NAME: pbj-shadow-smoke
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install test dependencies
        run: python -m pip install '.[dev]'
      - name: Run Python tests
        run: python -m pytest
      - name: Build deployment archive
        run: |
          mkdir -p build/aws-shadow/package/scripts
          python -m pip install . --target build/aws-shadow/package --no-compile --only-binary=:all:
          cp aws/lambda_function.py build/aws-shadow/package/
          cp scripts/{__init__,aggregate_season,generate_manifest,import_picks,score_week,select_active_week,should_poll,update_games}.py build/aws-shadow/package/scripts/
          cd build/aws-shadow/package
          # Import from the staged artifact, outside the source tree.
          python -c 'from lambda_function import lambda_handler; assert lambda_handler({}, None)["status"] == "ok"'
          zip -qr ../deployment.zip . -x '*/__pycache__/*' '*.pyc'
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: Deploy code and configure runtime
        run: |
          aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://build/aws-shadow/deployment.zip \
            --query '{LastUpdateStatus:LastUpdateStatus}'
          aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"
          aws lambda update-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --runtime python3.14 \
            --handler lambda_function.lambda_handler \
            --query '{Runtime:Runtime,Handler:Handler,LastUpdateStatus:LastUpdateStatus}'
          aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"
