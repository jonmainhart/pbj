name: Update Game Results

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: poll-games
  cancel-in-progress: false

jobs:
  update-games:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install project
        run: python -m pip install .

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine current week
        id: week
        run: |
          python scripts/select_active_week.py \
            2026 \
            "$GITHUB_OUTPUT"

      - name: Check whether polling is needed
        if: steps.week.outputs.found == 'true'
        id: poll
        shell: bash
        run: |
          set +e

          python scripts/should_poll.py \
            "${{ steps.week.outputs.season }}" \
            "${{ steps.week.outputs.week }}"

          status=$?

          set -e

          if [ "$status" -eq 0 ]; then
            echo "poll=true" >> "$GITHUB_OUTPUT"
            echo "Polling required."
            exit 0
          fi

          if [ "$status" -eq 1 ]; then
            echo "poll=false" >> "$GITHUB_OUTPUT"
            echo "Polling not required."
            exit 0
          fi

          echo "Polling decision failed with exit code $status."
          exit "$status"

      - name: Update games
        if: steps.poll.outputs.poll == 'true'
        shell: bash
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: |
          python scripts/update_games.py \
            "${{ steps.week.outputs.season }}" \
            "${{ steps.week.outputs.week }}" \
            --provider balldontlie

      - name: Commit game updates
        if: steps.poll.outputs.poll == 'true'
        shell: bash
        run: |
          week_file="data/${{ steps.week.outputs.season }}/week$(printf '%02d' '${{ steps.week.outputs.week }}').json"

          if git diff --quiet -- "$week_file"; then
            echo "No game updates to commit."
            exit 0
          fi

          git add "$week_file"

          git commit \
            -m "Update week ${{ steps.week.outputs.week }} games"

      - name: Score week
        if: steps.poll.outputs.poll == 'true'
        shell: bash
        run: |
          python scripts/score_week.py \
            "${{ steps.week.outputs.season }}" \
            "${{ steps.week.outputs.week }}"

      - name: Commit scoring updates
        if: steps.poll.outputs.poll == 'true'
        shell: bash
        run: |
          week_file="data/${{ steps.week.outputs.season }}/week$(printf '%02d' '${{ steps.week.outputs.week }}').json"

          if git diff --quiet -- "$week_file"; then
            echo "No scoring updates to commit."
            exit 0
          fi

          git add "$week_file"

          git commit \
            -m "Score week ${{ steps.week.outputs.week }}"

      - name: Aggregate season
        if: steps.poll.outputs.poll == 'true'
        shell: bash
        run: |
          python scripts/aggregate_season.py \
            "${{ steps.week.outputs.season }}"

      - name: Commit season updates
        if: steps.poll.outputs.poll == 'true'
        shell: bash
        run: |
          season_file="data/${{ steps.week.outputs.season }}/season.json"

          if git diff --quiet -- "$season_file"; then
            echo "No season updates to commit."
            exit 0
          fi

          git add "$season_file"

          git commit \
            -m "Update ${{ steps.week.outputs.season }} season standings"

      - name: Push updates
        if: steps.poll.outputs.poll == 'true'
        shell: bash
        run: |
          local_head="$(git rev-parse HEAD)"
          remote_head="$(git rev-parse "origin/${{ github.ref_name }}")"

          if [ "$local_head" = "$remote_head" ]; then
            echo "No commits to push."
            exit 0
          fi

          git push